# ── Research: Track → Predict → Act (home page) ──
# stage: track / predict / act (sets the color and icon). status: shown as a small label.
research:
  - stage: track
    label: Track
    status: Background
    title: Multi-Object Tracking
    body: Keeping persistent identities for many objects through motion and occlusion, so a system knows what is where over time.
  - stage: predict
    label: Predict
    status: Current focus
    title: Object-Centric World Models
    body: Extending tracking's motion prediction into action-conditioned models of how objects move and interact when a robot acts on them.
  - stage: act
    label: Act
    status: Current focus
    title: World Action Models & VLA
    body: Using those predictions for planning and control in robot manipulation, from world action models to vision-language-action policies.

