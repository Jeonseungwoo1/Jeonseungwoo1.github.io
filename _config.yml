# ── Research (home page) ─────────────────────────
research:
  - title: World Models for Manipulation
    body: Learning models that predict how a scene changes in response to actions, and using those predictions for planning and policy learning in robot manipulation.
  - title: World Action Models
    body: Unifying future video prediction and action generation in a single generative model, carrying physical priors from video pretraining into robot control.
  - title: Vision-Language-Action
    body: Generalization, real-time control, and contact-rich extensions of VLA policies that map vision and language to robot actions.

